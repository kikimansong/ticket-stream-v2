server:
  port: 8082

spring:
  application:
    name: concert-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_v2_concert_db
    driver-class-name: org.postgresql.Driver
    username: ticket
    password: "1234"
    hikari:
      pool-name: ConcertHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.ticketstream: INFO

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:concertdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
