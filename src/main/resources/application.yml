server:
  port: 8080

spring:
  application:
    name: ticket-stream-v2

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_v2_db
    driver-class-name: org.postgresql.Driver
    username: ticket
    password: "1234"
    hikari:
      pool-name: TicketStreamHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ticketstream-group
      auto-offset-reset: earliest
      auto-startup: false

logging:
  level:
    com.ticketstream: INFO

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
