name: ticket-stream-v2

services:
  # ========================================================
  # 1. PostgreSQL (서비스별 Database per Service)
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: ticket-v2-postgres
    restart: always
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: ticket_v2_main_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  # ========================================================
  # 2. Redis (대기열 ZSET & Redisson 분산 락)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: ticket-v2-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_v2_data:/data

  # ========================================================
  # 3. Apache Kafka (KRaft 단독 모드)
  # ========================================================
  kafka:
    image: 'bitnami/kafka:3.7'
    container_name: ticket-v2-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_v2_data:/bitnami/kafka

volumes:
  postgres_v2_data:
  redis_v2_data:
  kafka_v2_data:
