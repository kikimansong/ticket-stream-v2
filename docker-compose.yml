name: ticket-stream-v2

services:
  # ========================================================
  # 1. PostgreSQL (모놀리식 단일 데이터베이스)
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: ticket-v2-postgres
    # restart: always
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: ticket_v2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  # ========================================================
  # 2. Redis (대기열 ZSET & Redisson 분산 락)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: ticket-v2-redis
    # restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_v2_data:/data

  # ========================================================
  # 3. Apache Kafka (공식 최신 이미지 - KRaft 모드)
  # ========================================================
  kafka:
    image: apache/kafka:latest
    container_name: ticket-v2-kafka
    # restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 분리:
      # - CONTROLLER: KRaft 내부 합의 (9093)
      # - PLAINTEXT: 도커 내부 통신 (kafka:29092) -> kafka-ui 전용
      # - PLAINTEXT_HOST: 도커 외부 호스트 통신 (localhost:9092) -> 로컬 앱 전용
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_v2_data:/var/lib/kafka/data

  # ========================================================
  # 4. Kafka UI (웹 토픽 및 메시지 모니터링 대시보드)
  # ========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticket-v2-kafka-ui
    # restart: always
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-stream-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

volumes:
  postgres_v2_data:
  redis_v2_data:
  kafka_v2_data:
